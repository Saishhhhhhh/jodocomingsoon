<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Luxury Designer Sofa Test</title>
  <style>
    body { margin: 0; background: #F4EBDD; overflow: hidden; font-family: sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #header {
      position: absolute;
      top: 24px;
      left: 36px;
      z-index: 100;
    }
    #header img {
      height: 48px;
      width: auto;
    }
    #title {
      position: absolute;
      top: 28px;
      width: 100%;
      text-align: center;
      font-family: 'Syne', sans-serif, system-ui;
      font-size: 5vw;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: #C65F45;
      margin: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="header">
    <img src="/jodo-logo.png" alt="JODO - The Joy of Together">
  </div>
  <h1 id="title">COMING SOON</h1>
  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.setClearColor(new THREE.Color('#F4EBDD'), 1);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#F4EBDD');

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.28, 5.2);
    camera.lookAt(0, -0.06, 0);

    // Warm Architectural Studio Lighting
    const amb = new THREE.AmbientLight('#FAF2E6', 1.35);
    scene.add(amb);

    const key = new THREE.DirectionalLight('#FFF6EC', 2.8);
    key.position.set(-4.0, 5.5, 4.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0004;
    scene.add(key);

    const fill = new THREE.DirectionalLight('#E0EDF8', 1.15);
    fill.position.set(4.5, 2.5, -1.8);
    scene.add(fill);

    const rim = new THREE.DirectionalLight('#FFE8D6', 1.4);
    rim.position.set(0, 4.0, -4.5);
    scene.add(rim);

    // Soft Studio Ground Floor Contact Shadow (Radial gradient with 0 alpha edge)
    const floorGeo = new THREE.PlaneGeometry(10, 10);
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = 512;
    shadowCanvas.height = 512;
    const sCtx = shadowCanvas.getContext('2d');
    if (sCtx) {
      const grad = sCtx.createRadialGradient(256, 256, 10, 256, 256, 210);
      grad.addColorStop(0, 'rgba(50, 32, 22, 0.42)');
      grad.addColorStop(0.30, 'rgba(50, 32, 22, 0.22)');
      grad.addColorStop(0.65, 'rgba(50, 32, 22, 0.05)');
      grad.addColorStop(1, 'rgba(50, 32, 22, 0)');
      sCtx.fillStyle = grad;
      sCtx.fillRect(0, 0, 512, 512);
    }
    const shadowTex = new THREE.CanvasTexture(shadowCanvas);
    const floorMat = new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      opacity: 0.70,
      depthWrite: false,
    });
    const shadowMesh = new THREE.Mesh(floorGeo, floorMat);
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.y = -0.54;
    shadowMesh.scale.set(1.4, 0.85, 1);
    scene.add(shadowMesh);

    // Signature JODO Terracotta Woven Texture
    const createFabricTexture = () => {
      const cv = document.createElement('canvas');
      cv.width = 512;
      cv.height = 512;
      const ctx = cv.getContext('2d');
      if (ctx) {
        ctx.fillStyle = '#C65F45'; // Signature JODO Terracotta
        ctx.fillRect(0, 0, 512, 512);

        const idata = ctx.getImageData(0, 0, 512, 512);
        const data = idata.data;
        for (let i = 0; i < data.length; i += 4) {
          const noise = (Math.random() - 0.5) * 16;
          data[i] = Math.min(255, Math.max(0, data[i] + noise));
          data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise * 0.9));
          data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise * 0.8));
        }
        ctx.putImageData(idata, 0, 0);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 512; x += 4) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 512);
          ctx.stroke();
        }
        for (let y = 0; y < 512; y += 4) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(512, y);
          ctx.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    };

    const fabricTex = createFabricTexture();

    // High-end Terracotta Velvet Physical Material with Rich Sheen & Softness
    const velvetMat = new THREE.MeshPhysicalMaterial({
      map: fabricTex,
      color: new THREE.Color('#C65F45'),
      roughness: 0.60,
      metalness: 0.03,
      sheen: 0.95,
      sheenColor: new THREE.Color('#E5836B'),
      sheenRoughness: 0.38,
    });

    const velvetAccentMat = new THREE.MeshPhysicalMaterial({
      map: fabricTex,
      color: new THREE.Color('#B64F38'),
      roughness: 0.55,
      metalness: 0.03,
      sheen: 1.0,
      sheenColor: new THREE.Color('#EB8870'),
      sheenRoughness: 0.32,
    });

    const brassMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#D8B06B'),
      metalness: 0.88,
      roughness: 0.25,
    });

    const darkWoodMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#382315'), // Sleek dark smoked oak
      roughness: 0.40,
      metalness: 0.05,
    });

    // Helper: Sculpted Organic Cloud Cushion with Smooth Welded Vertices
    const createCloudCushion = (w, h, d, loft = 0.045, segX = 32, segY = 18, segZ = 32) => {
      let geo = new THREE.BoxGeometry(w, h, d, segX, segY, segZ);
      geo = mergeVertices(geo, 0.001);
      const pos = geo.attributes.position;
      const hw = w / 2;
      const hh = h / 2;
      const hd = d / 2;

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        const nx = Math.max(-1, Math.min(1, x / hw));
        const ny = Math.max(-1, Math.min(1, y / hh));
        const nz = Math.max(-1, Math.min(1, z / hd));

        // Soft organic crown on top (+y)
        if (ny > 0) {
          const topFactor = ny;
          pos.setY(i, y + loft * topFactor * (1 - nx * nx * 0.8) * (1 - nz * nz * 0.8));
        }

        // Waterfall forward roll on front edge (+z)
        if (nz > 0.3) {
          const frontFactor = (nz - 0.3) / 0.7;
          pos.setZ(i, z + loft * 0.5 * frontFactor * (1 - nx * nx * 0.6));
          if (ny > 0) {
            pos.setY(i, y - loft * 0.22 * frontFactor * (1 - nx * nx * 0.6));
          }
        }

        // Soft bulge on outer side faces
        if (Math.abs(nx) > 0.5) {
          const sideFactor = (Math.abs(nx) - 0.5) / 0.5;
          const sign = Math.sign(nx);
          pos.setX(i, x + sign * (loft * 0.25) * sideFactor * (1 - ny * ny) * (1 - nz * nz));
        }
      }

      geo.computeVertexNormals();
      return geo;
    };

    // Helper: Rounded Box with Smooth Bevels
    const createRoundedBox = (w, h, d, r = 0.04, s = 8) => {
      const shape = new THREE.Shape();
      const hw = w / 2 - r;
      const hh = h / 2 - r;

      shape.moveTo(-hw, -hh - r);
      shape.lineTo(hw, -hh - r);
      shape.absarc(hw, -hh, r, -Math.PI / 2, 0, false);
      shape.lineTo(hw + r, hh);
      shape.absarc(hw, hh, r, 0, Math.PI / 2, false);
      shape.lineTo(-hw, hh + r);
      shape.absarc(-hw, hh, r, Math.PI / 2, Math.PI, false);
      shape.lineTo(-hw - r, -hh);
      shape.absarc(-hw, -hh, r, Math.PI, Math.PI * 1.5, false);

      const extGeo = new THREE.ExtrudeGeometry(shape, {
        depth: d - r * 2,
        bevelEnabled: true,
        bevelSegments: s,
        steps: 1,
        bevelSize: r,
        bevelThickness: r,
      });
      extGeo.center();
      return extGeo;
    };

    // Main Sofa Group
    const sofaGroup = new THREE.Group();
    scene.add(sofaGroup);
    sofaGroup.position.set(0, -0.06, 0);

    // 1. SLEEK FLOATING PLINTH BASE WITH BRUSHED BRASS REVEAL
    const plinthW = 2.44;
    const plinthD = 0.94;
    const plinthH = 0.048;
    const plinthGeo = createRoundedBox(plinthW, plinthH, plinthD, 0.024, 8);
    const plinthMesh = new THREE.Mesh(plinthGeo, darkWoodMat);
    plinthMesh.position.set(0, -0.36, 0);
    plinthMesh.castShadow = true;
    plinthMesh.receiveShadow = true;
    sofaGroup.add(plinthMesh);

    // Architectural Brushed Brass Reveal Inset Trim
    const brassTrimGeo = createRoundedBox(plinthW + 0.012, 0.012, plinthD + 0.012, 0.016, 6);
    const brassTrim = new THREE.Mesh(brassTrimGeo, brassMat);
    brassTrim.position.set(0, -0.33, 0);
    brassTrim.castShadow = true;
    sofaGroup.add(brassTrim);

    // 4 Architectural Brass Stiletto Feet
    const legData = [
      { x: -1.04, z: 0.36, rotZ: 0.06, rotX: 0.05 },
      { x: 1.04, z: 0.36, rotZ: -0.06, rotX: 0.05 },
      { x: -1.04, z: -0.36, rotZ: 0.06, rotX: -0.05 },
      { x: 1.04, z: -0.36, rotZ: -0.06, rotX: -0.05 },
    ];
    legData.forEach(ld => {
      const legGeo = new THREE.CylinderGeometry(0.024, 0.014, 0.16, 20);
      const legMesh = new THREE.Mesh(legGeo, brassMat);
      legMesh.position.set(ld.x, -0.46, ld.z);
      legMesh.rotation.z = ld.rotZ;
      legMesh.rotation.x = ld.rotX;
      legMesh.castShadow = true;
      sofaGroup.add(legMesh);
    });

    // 2. CONTINUOUS UPHOLSTERED DECK PLATFORM
    const deckGeo = createRoundedBox(2.42, 0.11, 0.92, 0.04, 8);
    const deckMesh = new THREE.Mesh(deckGeo, velvetMat);
    deckMesh.position.set(0, -0.27, 0.01);
    deckMesh.castShadow = true;
    deckMesh.receiveShadow = true;
    sofaGroup.add(deckMesh);

    // 3. LUXURIOUS SCULPTED TRACK ARMS
    const armW = 0.25;
    const armH = 0.38;
    const armD = 0.94;
    const armGeo = createRoundedBox(armW, armH, armD, 0.055, 10);

    const armMeshL = new THREE.Mesh(armGeo, velvetMat);
    armMeshL.position.set(-1.085, -0.04, 0.01);
    armMeshL.castShadow = true;
    armMeshL.receiveShadow = true;
    sofaGroup.add(armMeshL);

    const armMeshR = new THREE.Mesh(armGeo, velvetMat);
    armMeshR.position.set(1.085, -0.04, 0.01);
    armMeshR.castShadow = true;
    armMeshR.receiveShadow = true;
    sofaGroup.add(armMeshR);

    // 4. CURVED UPHOLSTERED REAR BACKREST CHASSIS
    const backChassisGeo = createRoundedBox(1.94, 0.48, 0.18, 0.055, 8);
    const backChassisMesh = new THREE.Mesh(backChassisGeo, velvetMat);
    backChassisMesh.position.set(0, 0.05, -0.38);
    backChassisMesh.rotation.x = -0.08;
    backChassisMesh.castShadow = true;
    backChassisMesh.receiveShadow = true;
    sofaGroup.add(backChassisMesh);

    // 5. DUAL ULTRA-DEEP CLOUD SEAT CUSHIONS
    const seatW = 0.95;
    const seatH = 0.18;
    const seatD = 0.76;

    const seatMeshL = new THREE.Mesh(createCloudCushion(seatW, seatH, seatD, 0.045, 32, 18, 32), velvetMat);
    seatMeshL.position.set(-0.485, -0.13, 0.09);
    seatMeshL.castShadow = true;
    seatMeshL.receiveShadow = true;
    sofaGroup.add(seatMeshL);

    const seatMeshR = new THREE.Mesh(createCloudCushion(seatW, seatH, seatD, 0.045, 32, 18, 32), velvetMat);
    seatMeshR.position.set(0.485, -0.13, 0.09);
    seatMeshR.castShadow = true;
    seatMeshR.receiveShadow = true;
    sofaGroup.add(seatMeshR);

    // 6. DUAL TALL PLUSH CLOUD BACKREST PILLOWS
    const backW = 0.95;
    const backH = 0.45;
    const backD = 0.22;

    const backPillowL = new THREE.Mesh(createCloudCushion(backW, backH, backD, 0.055, 32, 22, 20), velvetMat);
    backPillowL.position.set(-0.485, 0.15, -0.24);
    backPillowL.rotation.x = -0.16;
    backPillowL.rotation.y = 0.015;
    backPillowL.castShadow = true;
    backPillowL.receiveShadow = true;
    sofaGroup.add(backPillowL);

    const backPillowR = new THREE.Mesh(createCloudCushion(backW, backH, backD, 0.055, 32, 22, 20), velvetMat);
    backPillowR.position.set(0.485, 0.15, -0.24);
    backPillowR.rotation.x = -0.16;
    backPillowR.rotation.y = -0.015;
    backPillowR.castShadow = true;
    backPillowR.receiveShadow = true;
    sofaGroup.add(backPillowR);

    // 7. SLEEK ARCHITECTURAL DESIGN - Pure sculptural lines without clipping pillows

    // ================= FULL 360° TURNTABLE DRAGGING WITH MOMENTUM =================
    let rotY = -0.22;
    let rotX = 0.06;
    let vx = 0;
    let vy = 0;
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    const onPointerDown = (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      vx = 0;
      vy = 0;
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    };

    const onPointerMove = (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      vx = dx * 0.0065;
      vy = dy * 0.0040;

      rotY += vx;
      rotX = Math.max(-0.25, Math.min(0.38, rotX + vy));
    };

    const onPointerUp = (e) => {
      isDragging = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
    };

    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    // Animation Loop
    const animate = () => {
      requestAnimationFrame(animate);

      if (!isDragging) {
        vx *= 0.93;
        vy *= 0.93;
        rotY += vx;
        rotX += vy;

        // Gentle auto drift when stopped
        if (Math.abs(vx) < 0.0001) {
          rotY += 0.0012;
        }
      }

      sofaGroup.rotation.y = rotY;
      sofaGroup.rotation.x = rotX;

      renderer.render(scene, camera);
    };

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
